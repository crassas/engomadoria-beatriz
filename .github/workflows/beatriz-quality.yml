name: Beatriz — vídeo e verificação
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'video/**'
      - 'package*.json'
      - 'docs/assets/photos/**'
      - 'docs/assets/fonts/**'
      - '.github/workflows/beatriz-quality.yml'
permissions:
  contents: write
concurrency:
  group: beatriz-quality
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Renderizar filme Remotion
        run: npm run video:render
      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Verificar percursos, acessibilidade e ecrãs
        run: npm run verify
      - name: Guardar filme e provas de revisão
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if [ -d .review ]; then git add .review; fi
          if ! git diff --cached --quiet; then
            git commit -m "build: render Beatriz film and record browser verification"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beatriz-review
          path: .review/
