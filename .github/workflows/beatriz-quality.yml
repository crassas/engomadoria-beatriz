name: Beatriz — vídeo e verificação
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'video/**'
      - 'package*.json'
      - 'docs/assets/photos/**'
      - 'docs/assets/fonts/**'
      - '.github/workflows/beatriz-quality.yml'
permissions:
  contents: write
concurrency:
  group: beatriz-quality
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preparar transição Elite em alta resolução
        run: |
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_30PO5dvwRcm4D8DO9CAK1SBGTb7/e982d540-6d94-4f20-8152-0e092900249d.mp4' -o /tmp/partner-cleaning-source.mp4
          ffmpeg -y -i /tmp/partner-cleaning-source.mp4 -an -vf "scale=1080:1920:flags=lanczos,unsharp=5:5:0.35:5:5:0.0" -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -movflags +faststart docs/assets/partner-cleaning-mobile-1080.mp4
          test -s docs/assets/partner-cleaning-mobile-1080.mp4
      - name: Renderizar filme Remotion
        run: npm run video:render
      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Verificar percursos, acessibilidade e ecrãs
        run: npm run verify
      - name: Guardar filme e provas de revisão
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if [ -d .review ]; then git add .review; fi
          if ! git diff --cached --quiet; then
            git commit -m "build: render Beatriz film and record browser verification"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beatriz-review
          path: .review/
